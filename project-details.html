<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <meta name="description" content="Detailed view of a UbiSys Research Group project at IIT Jodhpur.">
  <meta name="keywords" content="UbiSys project details, IIT Jodhpur research, IoT, edge computing">
  <meta property="og:title" content="Project Details | UbiSys Research Group">
  <meta property="og:description" content="In-depth information about a UbiSys Lab research project.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ubisysresearch.github.io/project-details.html">
  <meta property="og:image" content="https://ubisysresearch.github.io/assets/img/logo.png">
  <title>Project Details | UbiSys Research Group</title> <!-- Title will be updated dynamically -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- AOS Animate‑On‑Scroll CSS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <!-- Project Image Container -->
  <div id="project-image-container" class="container-fluid p-0"> 
    <!-- Image will be loaded here -->
  </div>

  <!-- Dynamic Hero Banner -->
  <header class="bg-dark text-white py-5 text-center" data-aos="fade-up" id="project-hero-banner">
    <div class="container">
      <h1 class="display-5 fw-bold" id="project-hero-title">Project Title</h1>
      <p class="lead" id="project-hero-tagline">Project details loading...</p>
    </div>
  </header>

  <!-- Project Detail Section -->
  <section class="py-5">
    <div class="container" id="project-detail-container">
      <!-- Project details will be loaded here -->
      <div class="text-center">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AOS Animate‑On‑Scroll JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 800,
      once: true,
    });

    // Function to display project details
    function displayProjectDetails(project) {
      const container = document.getElementById('project-detail-container');
      const imageContainer = document.getElementById('project-image-container'); // Get image container
      document.title = `${project.title} | UbiSys Research Group`; // Update page title

      // Update Hero Banner Content
      const heroTitle = document.getElementById('project-hero-title');
      const heroTagline = document.getElementById('project-hero-tagline');
      heroTitle.textContent = project.title;
      heroTagline.textContent = `Status: ${project.status}`; // Or use project.description

      // Add Image to its container
      imageContainer.innerHTML = `
        <img src="${project.image}" class="img-fluid w-100" alt="${project.title} Image" data-aos="fade-in" style="max-height: 450px; object-fit: cover; object-position: center;">
      `;

      // Populate Main Content Area (without the image)
      container.innerHTML = `
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div data-aos="fade-up" data-aos-delay="100">
              <p class="lead">${project.full_description}</p>
              <hr>
              <p><strong>Details:</strong> ${project.details}</p>
              <!-- Add more details here if needed -->
              <div class="text-center mt-4">
                 <a href="projects.html" class="btn btn-outline-secondary">Back to Projects</a>
               </div>
            </div>
          </div>
        </div>
      `;
       // Re-initialize AOS after adding dynamic content
       AOS.refresh();
    }

    // Function to display 'not found' message
    function displayNotFound() {
       // Hide Hero Banner and Image Container if project not found
       const heroBanner = document.getElementById('project-hero-banner');
       const imageContainer = document.getElementById('project-image-container');
       if(heroBanner) heroBanner.style.display = 'none';
       if(imageContainer) imageContainer.style.display = 'none';

       const container = document.getElementById('project-detail-container');
       document.title = 'Project Not Found | UbiSys Research Group';
       container.innerHTML = `
         <div class="text-center" data-aos="fade-up">
           <h2 class="text-danger">Project Not Found</h2>
           <p>The project you are looking for does not exist or the link is incorrect.</p>
           <a href="projects.html" class="btn btn-primary mt-3">Back to Projects</a>
         </div>
       `;
        // Re-initialize AOS after adding dynamic content
        AOS.refresh();
    }

    // Get project index from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const projectIndex = parseInt(urlParams.get('index'), 10); // Using index as identifier

    // Project data (inline to work with file:// protocol for local development)
    var projects = [
      {"title":"Behavioral Health Disorder Detection","description":"Detecting behavioural health disorders of older adults using self supervised learning and causal reasoning.","full_description":"project-details","details":"Role: Co-PI | Cost: Rs. 69.90 Lakhs | Sponsor: NSF-TIH Indo-USA Joint Collaboration (TIH ISI Kolkata)","image":"img/placeholder.png","status":"Completed"},
      {"title":"Smart Water Supply Grid","description":"Demonstration Centre for Smart Graded-Water Supply Grid.","full_description":"project-details","details":"Role: Co-PI | Cost: Rs. 40 Lakhs | Sponsor: JCKIC","image":"img/placeholder.png","status":"Completed"},
      {"title":"Campus Wildlife Inventorization","description":"Inventorization of the wildlife towards a sustainable campus.","full_description":"project-details","details":"Role: PI | Cost: Rs. 2 Lakhs | Sponsor: CETSD Campus Sustainability Program, IIT Jodhpur (JCKIC) 2021-2022","image":"img/placeholder.png","status":"Completed"},
      {"title":"Adaptive Middleware for Smart Buildings","description":"Design and Development of an Adaptive Middleware for Smart Building Monitoring.","full_description":"project-details","details":"Role: PI | Cost: Rs. 21.84 Lakhs | Sponsor: SERB, DST (2017-2020)","image":"img/placeholder.png","status":"Completed"},
      {"title":"AIOT Bed Occupancy Detection","description":"AIOT based Bed Occupancy Detection in a Hospital Setup.","full_description":"project-details","details":"Role: Co-PI | Cost: Rs. 10 Lakhs | Sponsor: JCKIC (Govt. of India) June-Aug 2021","image":"img/placeholder.png","status":"Completed"},
      {"title":"Cuffless BP Monitoring Device","description":"Design of a Cuffless Continuous BP Monitoring Device.","full_description":"project-details","details":"Role: Co-PI | Cost: Rs. 9 Lakhs | Sponsor: Johari Digital Healthcare Ltd. (2021-2022)","image":"img/placeholder.png","status":"Completed"},
      {"title":"Behavioral Disorder Monitoring & Intervention","description":"Pervasive and Personalized Aid for Continuous Monitoring of Behavioral Disorders and Timely Intervention Toward Addressing Special Needs in Child Education.","full_description":"project-details","details":"Role: PI | Cost: USD 60,000 | Sponsor: Google Academic Research Award 2024","image":"img/placeholder.png","status":"Ongoing/Approved"},
      {"title":"Next-gen Wargaming Interface","description":"Seamless Man-Machine Interface for Next-generation Wargaming.","full_description":"project-details","details":"Role: PI | Cost: Rs. 5.38 Crore | Sponsor: DRDO, DIA-COE IIT Jodhpur","image":"img/placeholder.png","status":"Ongoing/Approved"},
      {"title":"Smart Heritage Management","description":"Comprehensive Risk Assessment Data for Heritage Sites and Development of Smart Heritage Management Systems.","full_description":"project-details","details":"Role: Co-PI | Cost: Rs. 56 Lakhs | Sponsor: DST","image":"img/placeholder.png","status":"Ongoing/Approved"},
      {"title":"AI Strategist for Wargames","description":"Developing Multiagent System based AI Strategist for Wargames.","full_description":"project-details","details":"Role: Co-PI | Cost: Rs. 5.69 Crore | Sponsor: DRDO, DIA-COE IIT Jodhpur","image":"img/placeholder.png","status":"Ongoing/Approved"},
      {"title":"ConSenseHAR","description":"Decentralized collaborative context sensing towards pervasive Human Activity Recognition.","full_description":"project-details","details":"Role: PI | Cost: Rs. 29 Lakhs | Sponsor: Core Research Grant, SERB, DST","image":"img/placeholder.png","status":"Ongoing/Approved"},
      {"title":"SensePod","description":"An AIoT based testbed to promote Sensing as a Service for ambient living.","full_description":"project-details","details":"Role: PI | Cost: Rs. 41.9 Lakhs | Sponsor: SEED Grant, IIT Jodhpur, 2022","image":"img/placeholder.png","status":"Ongoing/Approved","page":"sensepod.html"},
      {"title":"Cyber Physical Systems Security","description":"Centre for Advanced Security Technology Development in Cyber Physical Systems.","full_description":"project-details","details":"Role: Co-PI | Cost: Rs. 642.18 Lakhs | Sponsor: MeitY (2022-2025)","image":"img/placeholder.png","status":"Ongoing/Approved"}
    ];

    if (isNaN(projectIndex) || projectIndex < 0 || projectIndex >= projects.length) {
        displayNotFound();
    } else {
        displayProjectDetails(projects[projectIndex]);
    }
  </script>
  <script src="assets/js/includes.js"></script>
  <script src="assets/js/search-data.js" defer></script>
  <script src="assets/js/search.js"></script>
</body>
</html>
